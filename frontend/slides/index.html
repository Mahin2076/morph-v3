<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1626">
    <meta name="description" content="Morph: test a city decision with 10,000 synthetic residents grounded in Census microdata.">
    <title>Morph — Acalanes Data Fest</title>
    <link rel="stylesheet" href="./slides.css">
  </head>
  <body>
    <main class="viewport" aria-label="Morph presentation">
      <div class="stage" id="stage">
        <div id="world" class="world" aria-hidden="true">
          <div class="map"></div>
          <canvas id="residents" class="residents"></canvas>
        </div>
        <div class="scrim" aria-hidden="true"></div>
        <div id="slide" class="slide" aria-live="polite"></div>
        <div class="progress" aria-hidden="true"><i id="progress-fill"></i></div>
        <nav class="chrome" aria-label="Slide navigation">
          <span class="brand"><i></i>morph</span>
          <span class="spacer"></span>
          <span class="hint">← → slides · N notes</span>
          <button id="prev" type="button" aria-label="Previous slide">←</button>
          <span id="count" class="count">1 / 6</span>
          <button id="next" type="button" aria-label="Next slide">→</button>
        </nav>
      </div>
      <aside id="notes" class="speaker-notes" hidden aria-label="Presenter notes"></aside>
    </main>
    <script src="./slides.js" defer></script>
  </body>
</html>
